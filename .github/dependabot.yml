version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      ignore:
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
      groups:
          dependencias:
              patterns: ["*"]
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
